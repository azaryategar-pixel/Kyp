<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Explore Creator - Kyp</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
<style>

* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
font-family: Arial, sans-serif;
background: #0b0b0f;
color: white;
}

.container {
max-width: 900px;
margin: auto;
padding: 20px;
}

nav {
display: flex;
justify-content: space-between;
align-items: center;
padding: 15px 0 40px;
}

.logo {
font-size: 25px;
font-weight: bold;
}

.back {
color: #a1a1aa;
text-decoration: none;
font-size: 14px;
}

h1 {
font-size: 42px;
margin-bottom: 10px;
}

.subtitle {
color: #a1a1aa;
margin-bottom: 30px;
}

.search {
width: 100%;
padding: 16px;
background: #15151b;
border: 1px solid #29292f;
border-radius: 12px;
color: white;
font-size: 16px;
outline: none;
margin-bottom: 25px;
}

.creators {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 15px;
}

.creator {
background: #15151b;
border: 1px solid #29292f;
border-radius: 18px;
padding: 20px;
}

.top {
display: flex;
align-items: center;
gap: 14px;
}

.avatar {
width: 55px;
height: 55px;
border-radius: 50%;
background: #27272a;

display: flex;
align-items: center;
justify-content: center;

font-weight: bold;
font-size: 20px;

overflow: hidden;
flex-shrink: 0;
}

.avatar img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}

.name {
font-weight: bold;
font-size: 17px;
}

.username {
color: #a1a1aa;
font-size: 13px;
margin-top: 4px;
}

.bio {
color: #a1a1aa;
font-size: 14px;
line-height: 1.5;
margin: 18px 0;
}

.donate {
display: block;
width: 100%;
text-align: center;
padding: 12px;
border-radius: 10px;
background: white;
color: black;
text-decoration: none;
font-weight: bold;
}

footer {
text-align: center;
color: #71717a;
padding: 50px 0 20px;
font-size: 13px;
}

@media (max-width: 650px) {

h1 {
font-size: 34px;
}

.creators {
grid-template-columns: 1fr;
}

}

</style>

</head>

<body>

<div class="container">

<nav>

<div class="logo">
Kyp.
</div>

<a
class="back"
href="../index.html"
>
← Kembali
</a>

</nav>


<h1>
Explore Creator
</h1>

<p class="subtitle">
Temukan creator favoritmu dan berikan dukungan kepada mereka.
</p>


<input
class="search"
type="text"
id="search"
placeholder="🔎 Cari creator..."
onkeyup="searchCreator()"
>


<div
class="creators"
id="creators"
>
</div>


<footer>
Powered by Kyp.
</footer>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://qgjcnxremlucixexaryj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MUaoxjo8pjoCS2Jj7BVnAg_EoJXD8XD";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   DATA CREATOR
========================================= */

let allCreators = [];


/* =========================================
   LOAD CREATORS
========================================= */

async function loadCreators() {

    const container =
        document.getElementById("creators");

    container.innerHTML = `
        <div style="
            grid-column: 1 / -1;
            text-align: center;
            color: #71717a;
            padding: 40px;
        ">
            Memuat creator...
        </div>
    `;


    try {

        const {
            data,
            error
        } = await supabaseClient

            .from("profiles")

            .select(`
                id,
                username,
                display_name,
                bio,
                avatar_url
            `)

            .order(
                "display_name",
                {
                    ascending: true
                }
            );


        if (error) {

            console.error(
                "Gagal mengambil creator:",
                error
            );

            container.innerHTML = `
                <div style="
                    grid-column: 1 / -1;
                    text-align: center;
                    color: #f87171;
                    padding: 40px;
                ">
                    Gagal memuat creator.
                </div>
            `;

            return;

        }


        allCreators =
            data || [];

        renderCreators(
            allCreators
        );


    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div style="
                grid-column: 1 / -1;
                text-align: center;
                color: #f87171;
                padding: 40px;
            ">
                Terjadi kesalahan saat memuat creator.
            </div>
        `;

    }

}


/* =========================================
   RENDER CREATOR
========================================= */

function renderCreators(
    creators
) {

    const container =
        document.getElementById(
            "creators"
        );


    if (!creators.length) {

        container.innerHTML = `
            <div style="
                grid-column: 1 / -1;
                text-align: center;
                color: #71717a;
                padding: 40px;
            ">
                Belum ada creator.
            </div>
        `;

        return;

    }


    container.innerHTML =
        creators.map(
            function(creator) {

                const name =
                    creator.display_name ||
                    creator.username ||
                    "Creator";


                const username =
                    creator.username ||
                    "";


                const bio =
                    creator.bio ||
                    "Content Creator";


                const initial =
                    name
                        .charAt(0)
                        .toUpperCase();


                const avatar =
                    creator.avatar_url;


                const avatarHTML =
                    avatar
                    ?
                    `
                        <img
                            src="${escapeHtml(avatar)}"
                            alt="${escapeHtml(name)}"
                        >
                    `
                    :
                    initial;


                return `

                    <div
                        class="creator"
                        data-name="
                            ${escapeHtml(
                                (
                                    name +
                                    " " +
                                    username +
                                    " " +
                                    bio
                                ).toLowerCase()
                            )}
                        "
                    >

                        <div class="top">

                            <div class="avatar">

                                ${avatarHTML}

                            </div>


                            <div>

                                <div class="name">

                                    ${escapeHtml(
                                        name
                                    )}

                                </div>


                                <div class="username">

                                    @${escapeHtml(
                                        username
                                    )}

                                </div>

                            </div>

                        </div>


                        <p class="bio">

                            ${escapeHtml(
                                bio
                            )}

                        </p>


                        <a
                            class="donate"
                            href="../${encodeURIComponent(username)}/"
                        >
                            Dukung Creator
                        </a>

                    </div>

                `;

            }
        ).join("");

}


/* =========================================
   SEARCH
========================================= */

function searchCreator() {

    const keyword =
        (
            document
                .getElementById(
                    "search"
                )
                .value || ""
        )
        .toLowerCase()
        .trim();


    const filtered =
        allCreators.filter(
            function(creator) {

                const text = (

                    creator.display_name ||
                    "" +

                    " " +

                    creator.username ||
                    "" +

                    " " +

                    creator.bio ||
                    ""

                ).toLowerCase();


                return text.includes(
                    keyword
                );

            }
        );


    renderCreators(
        filtered
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text ?? "";


    return div.innerHTML;

}


/* =========================================
   START
========================================= */

loadCreators();

</script>


</body>
</html>
