<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>@azaryatgr - Kyp</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0b0f;
    color: white;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
    padding: 20px;
}

.back {
    display: inline-block;
    color: #a1a1aa;
    text-decoration: none;
    margin: 15px 0 35px;
}

.profile {
    text-align: center;
}

.avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #27272a;
    margin: auto;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;
    font-weight: bold;

    border: 3px solid #3f3f46;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
}
    
.username {
    margin-top: 18px;
    font-size: 27px;
    font-weight: bold;
}

.verified {
    color: #60a5fa;
}

.bio {
    color: #a1a1aa;
    margin: 10px auto 25px;
    line-height: 1.6;
    max-width: 450px;
}

.socials {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 30px;
}

.social {
    border: 1px solid #333;
    padding: 8px 14px;
    border-radius: 10px;
    color: white;
    text-decoration: none;
    font-size: 14px;
}

.donate-card {
    background: #15151b;
    border: 1px solid #29292f;
    border-radius: 20px;
    padding: 25px;
    text-align: left;
}

.donate-title {
    text-align: center;
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 22px;
}

.amounts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.amount {
    padding: 14px 5px;
    background: #0b0b0f;
    color: white;
    border: 1px solid #333;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
}

.amount:hover,
.amount.active {
    background: white;
    color: black;
}

label {
    display: block;
    margin: 22px 0 8px;
    font-weight: bold;
}

input,
textarea {
    width: 100%;
    background: #0b0b0f;
    border: 1px solid #333;
    color: white;
    padding: 14px;
    border-radius: 12px;
    outline: none;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.anonymous {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    color: #a1a1aa;
    font-size: 14px;
}

.anonymous input {
    width: auto;
}

.donate-button {
    width: 100%;
    margin-top: 22px;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: white;
    color: black;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.recent {
    margin-top: 30px;
}

.recent h2 {
    font-size: 20px;
    margin-bottom: 15px;
}

.support {
    background: #15151b;
    border: 1px solid #29292f;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 10px;
}

.support-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 7px;
}

.support-name {
    font-weight: bold;
}

.support-amount {
    font-weight: bold;
}

.support-message {
    color: #a1a1aa;
    font-size: 14px;
}

footer {
    text-align: center;
    color: #71717a;
    padding: 35px 0 20px;
    font-size: 13px;
}

@media (max-width: 450px) {
    .amounts {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<div class="container">

<a class="back" href="../index.html">
← Kembali ke Kyp
</a>

<section class="profile">

<div class="avatar" id="creatorAvatar">
    A
</div>

<div class="username">
<span id="creatorName">@azaryatgr</span>
</div>

<p class="bio" id="creatorBio">
Memuat profil creator...
</p>

<div class="socials">
<a class="social" href="#">Instagram</a>
<a class="social" href="#">YouTube</a>
<a class="social" href="#">TikTok</a>
</div>

</section>


<section class="donate-card">

<div class="donate-title">
☕ Dukung Creator Ini
</div>

<div class="amounts">

<button class="amount" onclick="selectAmount(10000, this)">
Rp10K
</button>

<button class="amount" onclick="selectAmount(25000, this)">
Rp25K
</button>

<button class="amount" onclick="selectAmount(50000, this)">
Rp50K
</button>

<button class="amount" onclick="selectAmount(100000, this)">
Rp100K
</button>

<button class="amount" onclick="selectAmount(250000, this)">
Rp250K
</button>

<button class="amount" onclick="selectAmount(500000, this)">
Rp500K
</button>

</div>


<label>Nominal Donasi</label>

<input
id="amount"
type="number"
placeholder="Contoh: 50000"
>


<label>Nama</label>

<input
id="name"
type="text"
placeholder="Nama kamu"
>


<label>Pesan</label>

<textarea
id="message"
placeholder="Tulis pesan untuk creator..."
></textarea>


<label class="anonymous">

<input type="checkbox" id="anonymous">

Sembunyikan nama saya

</label>


<button
class="donate-button"
onclick="donate()"
>
Dukung Sekarang
</button>

</section>


<section class="recent">

<h2>💬 Dukungan Terbaru</h2>

<div class="support">

<div class="support-top">

<span class="support-name">
Budi
</span>

<span class="support-amount">
Rp50.000
</span>

</div>

<div class="support-message">
Semangat terus! 🔥
</div>

</div>


<div class="support">

<div class="support-top">

<span class="support-name">
Anonymous
</span>

<span class="support-amount">
Rp25.000
</span>

</div>

<div class="support-message">
Sukses selalu!
</div>

</div>

</section>


<footer>
Powered by Kyp.
</footer>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://qgjcnxremlucixexaryj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_MUaoxjo8pjoCS2Jj7BVnAg_EoJXD8XD";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

/* =========================
   LOAD PROFILE CREATOR
========================= */

async function loadProfile() {

    const {
        data: creator,
        error
    } = await supabaseClient
        .from("profiles")
        .select("username, display_name, bio, avatar_url")
        .eq("username", "azaryatgr")
        .eq("is_public", true)
        .single();

    if (error || !creator) {

        console.error("Profile error:", error);

        document.getElementById("creatorName").textContent =
            "@azaryatgr";

        document.getElementById("creatorBio").textContent =
            "Profil creator tidak tersedia.";

        return;
    }

    const displayName =
        creator.display_name ||
        creator.username ||
        "Creator";

    document.getElementById("creatorName").textContent =
        displayName;

    document.getElementById("creatorBio").textContent =
        creator.bio ||
        "Terima kasih sudah mendukung saya ❤️";

    const avatar = document.getElementById("creatorAvatar");

if (creator.avatar_url) {
    avatar.innerHTML = `
        <img
            src="${creator.avatar_url}"
            alt="${displayName}"
        >
    `;
} else {
    avatar.textContent =
        displayName.charAt(0).toUpperCase();
}

    document.title =
        displayName + " - Kyp";
}
/* =========================
   PILIH NOMINAL
========================= */

function selectAmount(amount, button) {

  document.getElementById("amount").value = amount;

  document
    .querySelectorAll(".amount")
    .forEach(function(item) {
      item.classList.remove("active");
    });

  button.classList.add("active");
}


/* =========================
   DONASI
========================= */

async function donate() {

  const amountInput =
    document.getElementById("amount");

  const nameInput =
    document.getElementById("name");

  const messageInput =
    document.getElementById("message");

  const anonymousInput =
    document.getElementById("anonymous");


  const amount =
    Number(amountInput.value);

  const name =
    nameInput.value.trim();

  const message =
    messageInput.value.trim();

  const anonymous =
    anonymousInput.checked;


  /* Validasi */

  if (!amount || amount < 1000) {

    alert(
      "Masukkan nominal donasi minimal Rp1.000"
    );

    return;
  }


  /* Cari creator */

  const {
    data: creator,
    error: creatorError
  } = await supabaseClient

    .from("profiles")

    .select("id, username, display_name")

    .eq("username", "azaryatgr")

    .eq("is_public", true)

    .single();


  if (creatorError || !creator) {

    console.error(creatorError);

    alert(
      "Creator tidak ditemukan."
    );

    return;
  }


  /* Simpan donasi */

  /* Buat ID transaksi */

const paymentReference =
    "KYP-" +
    Date.now() +
    "-" +
    Math.random()
        .toString(36)
        .substring(2, 8)
        .toUpperCase();


/* Simpan donasi */

const {
    error
} = await supabaseClient

    .from("donations")

    .insert({

        creator_id: creator.id,

        amount: amount,

        donor_name:
            anonymous
                ? "Anonymous"
                : (name || "Anonymous"),

        message: message,

        hide_name: anonymous,

        status: "pending",

        payment_reference:
            paymentReference

    });


if (error) {

    console.error(
        "VERSI BARU KYP:",
        error
    );

    alert(
        "Donasi gagal disimpan.\n\n" +
        error.message
    );

    return;
}


/* Masuk ke halaman checkout */

window.location.href =
    "../checkout.html?ref=" +
    encodeURIComponent(
        paymentReference
    ) +
    "&amount=" +
    encodeURIComponent(
        amount
    );


  /* Reset form */

  amountInput.value = "";

  nameInput.value = "";

  messageInput.value = "";

  anonymousInput.checked = false;


  loadDonations();

}


/* =========================
   TAMPILKAN DONASI
========================= */

async function loadDonations() {

  const recent =
    document.querySelector(".recent");

  if (!recent) return;

  recent.innerHTML =
    `
      <h2>💬 Dukungan Terbaru</h2>

      <p style="
        color:#888;
        text-align:center;
        padding:20px;
      ">
        Memuat dukungan...
      </p>
    `;


  /* =========================
     CARI CREATOR
  ========================= */

  const {
    data: creator,
    error: creatorError
  } = await supabaseClient

    .from("profiles")

    .select(
      "id, username, display_name"
    )

    .eq(
      "username",
      "azaryatgr"
    )

    .eq(
      "is_public",
      true
    )

    .single();


  if (
    creatorError ||
    !creator
  ) {

    console.error(
      "Creator error:",
      creatorError
    );

    recent.innerHTML =
      `
        <h2>💬 Dukungan Terbaru</h2>

        <p style="
          color:#f87171;
          text-align:center;
          padding:20px;
        ">
          Creator tidak ditemukan.
        </p>
      `;

    return;
  }


  /* =========================
     AMBIL DONASI CREATOR
  ========================= */

  const {
    data,
    error
  } = await supabaseClient

    .from("donations")

    .select(
      "amount, donor_name, message, hide_name, created_at"
    )

    .eq(
      "creator_id",
      creator.id
    )

    .eq(
      "status",
      "paid"
    )

    .order(
      "created_at",
      {
        ascending: false
      }
    )

    .limit(10);


  if (error) {

    console.error(
      "Donation error:",
      error
    );

    recent.innerHTML =
      `
        <h2>💬 Dukungan Terbaru</h2>

        <p style="
          color:#f87171;
          text-align:center;
          padding:20px;
        ">
          Gagal memuat dukungan.
        </p>
      `;

    return;
  }


  /* =========================
     HEADER
  ========================= */

  recent.innerHTML =
    "<h2>💬 Dukungan Terbaru</h2>";


  /* =========================
     BELUM ADA DONASI
  ========================= */

  if (
    !data ||
    data.length === 0
  ) {

    recent.innerHTML +=
      `
        <p style="
          color:#888;
          text-align:center;
          padding:20px;
        ">
          Belum ada dukungan.
        </p>
      `;

    return;
  }


  /* =========================
     RENDER DONASI
  ========================= */

  data.forEach(
    function(donation) {

      const name =
        donation.hide_name
          ? "Anonymous"
          : (
              donation.donor_name ||
              "Anonymous"
            );


      const amount =
        Number(
          donation.amount || 0
        ).toLocaleString(
          "id-ID"
        );


      const message =
        donation.message ||
        "";


      recent.innerHTML +=
        `

          <div class="support">

            <div class="support-top">

              <span class="support-name">
                ${escapeHtml(name)}
              </span>

              <span class="support-amount">
                Rp${amount}
              </span>

            </div>

            ${
              message
              ?
              `
                <div class="support-message">
                  ${escapeHtml(message)}
                </div>
              `
              :
              ""
            }

          </div>

        `;

    }
  );

}

  

/* =========================
   SECURITY
========================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* =========================
   LOAD SAAT HALAMAN DIBUKA
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadProfile();
    loadDonations();

  }
);

</script>

</body>
</html>
