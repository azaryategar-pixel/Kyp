<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Kyp</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0f;
  color: white;
}

.container {
  width: 100%;
  max-width: 1100px;
  margin: auto;
  padding: 25px 18px 50px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 30px;
}

.logo {
  font-size: 28px;
  font-weight: bold;
}

.logo span {
  color: #a855f7;
}

.header-buttons {
  display: flex;
  gap: 10px;
}

.header-buttons a {
  text-decoration: none;
  color: white;
  background: #18181f;
  border: 1px solid #292933;
  padding: 10px 15px;
  border-radius: 10px;
}

.profile {
  background: #15151b;
  border: 1px solid #292933;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 22px;
}

.profile-name {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 5px;
}

.username {
  color: #a1a1aa;
}

.status {
  display: inline-block;
  margin-top: 12px;
  padding: 6px 10px;
  border-radius: 20px;
  background: #172317;
  color: #4ade80;
  font-size: 13px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 25px;
}

.stat {
  background: #15151b;
  border: 1px solid #292933;
  border-radius: 16px;
  padding: 20px;
}

.stat-title {
  color: #a1a1aa;
  font-size: 14px;
  margin-bottom: 10px;
}

.stat-value {
  font-size: 25px;
  font-weight: bold;
}

.card {
  background: #15151b;
  border: 1px solid #292933;
  border-radius: 18px;
  overflow: hidden;
}

.card-header {
  padding: 20px;
  border-bottom: 1px solid #292933;
}

.card-header h2 {
  margin: 0;
  font-size: 20px;
}

.donation {
  padding: 18px 20px;
  border-bottom: 1px solid #24242d;
}

.donation:last-child {
  border-bottom: none;
}

.donation-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.donor {
  font-weight: bold;
}

.amount {
  font-weight: bold;
  color: #4ade80;
}

.message {
  color: #a1a1aa;
  margin-top: 8px;
  line-height: 1.5;
}

.status-donation {
  font-size: 13px;
  margin-top: 8px;
}

.pending {
  color: #facc15;
}

.paid {
  color: #4ade80;
}

.empty {
  padding: 35px 20px;
  text-align: center;
  color: #71717a;
}

.error {
  padding: 20px;
  color: #f87171;
  text-align: center;
}

.main-button {
  display: inline-block;
  margin-top: 20px;
  background: white;
  color: black;
  text-decoration: none;
  padding: 12px 18px;
  border-radius: 10px;
  font-weight: bold;
}

.loading {
  padding: 35px 20px;
  text-align: center;
  color: #a1a1aa;
}

@media (max-width: 700px) {

  .header {
    align-items: flex-start;
    flex-direction: column;
  }

  .header-buttons {
    width: 100%;
  }

  .header-buttons a {
    flex: 1;
    text-align: center;
  }

  .stats {
    grid-template-columns: 1fr;
  }

  .donation-top {
    flex-direction: column;
  }

}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">
      K<span>yp</span>
    </div>

    <div class="header-buttons">

      <a href="../index.html">
        Beranda
      </a>

      <a href="../azaryatgr/index.html">
        Halaman Donasi
      </a>

    </div>

  </div>


  <div class="profile">

    <div class="profile-name">
      Azaryatgr
    </div>

    <div class="username">
      @azaryatgr
    </div>

    <div class="status">
      ● Creator Aktif
    </div>

    <br>

    <a
      class="main-button"
      href="../azaryatgr/index.html"
    >
      Lihat Halaman Donasi
    </a>

  </div>


  <div class="stats">

    <div class="stat">

      <div class="stat-title">
        Total Donasi
      </div>

      <div
        class="stat-value"
        id="totalDonation"
      >
        Rp0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Jumlah Donasi
      </div>

      <div
        class="stat-value"
        id="donationCount"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Menunggu Pembayaran
      </div>

      <div
        class="stat-value"
        id="pendingCount"
      >
        0
      </div>

    </div>

  </div>


  <div class="card">

    <div class="card-header">

      <h2>
        Donasi Terbaru
      </h2>

    </div>

    <div id="donationList">

      <div class="loading">
        Memuat data donasi...
      </div>

    </div>

  </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */


/*
   GANTI 2 BAGIAN DI BAWAH INI
*/


const SUPABASE_URL =
  "https://qgjcnxremlucixexaryj.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_MUaoxjo8pjoCS2Jj7BVnAg_EoJXD8XD";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   FORMAT RUPIAH
========================================= */

function formatRupiah(amount) {

  return "Rp" +
    Number(amount || 0)
      .toLocaleString("id-ID");

}


/* =========================================
   LOAD DASHBOARD
========================================= */

async function loadDashboard() {

  try {

    /* Cari creator */

    const {
      data: creator,
      error: creatorError
    } = await supabaseClient

      .from("profiles")

      .select("id, username, display_name")

      .eq("username", "azaryatgr")

      .eq("is_public", true)

      .single();


    if (creatorError) {

      console.error(
        "Creator error:",
        creatorError
      );

      showError(
        "Creator tidak ditemukan."
      );

      return;

    }


    /* Ambil semua donasi creator */

    const {
      data: donations,
      error: donationError
    } = await supabaseClient

      .from("donations")

      .select(
        "amount, donor_name, message, hide_name, status, created_at"
      )

      .eq(
        "creator_id",
        creator.id
      )

      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (donationError) {

      console.error(
        "Donation error:",
        donationError
      );

      showError(
        "Gagal mengambil data donasi."
      );

      return;

    }


    const list =
      donations || [];


    /* =====================================
       STATISTIK
    ===================================== */


    const total =
      list.reduce(
        function(sum, donation) {

          return sum +
            Number(donation.amount || 0);

        },
        0
      );


    const count =
      list.length;


    const pending =
      list.filter(
        function(donation) {

          return donation.status === "pending";

        }
      ).length;


    document.getElementById(
      "totalDonation"
    ).textContent =
      formatRupiah(total);


    document.getElementById(
      "donationCount"
    ).textContent =
      count;


    document.getElementById(
      "pendingCount"
    ).textContent =
      pending;


    /* =====================================
       TAMPILKAN DONASI
    ===================================== */


    const donationList =
      document.getElementById(
        "donationList"
      );


    if (list.length === 0) {

      donationList.innerHTML =
        '<div class="empty">' +
        'Belum ada donasi.' +
        '</div>';

      return;

    }


    donationList.innerHTML =
      list.map(
        function(donation) {

          const donor =
            donation.hide_name
              ? "Anonymous"
              : (
                  donation.donor_name ||
                  "Anonymous"
                );


          let statusText =
            donation.status ||
            "pending";


          let statusClass =
            statusText === "paid"
              ? "paid"
              : "pending";


          return `

            <div class="donation">

              <div class="donation-top">

                <div class="donor">
                  ${escapeHtml(donor)}
                </div>

                <div class="amount">
                  ${formatRupiah(donation.amount)}
                </div>

              </div>

              ${
                donation.message
                  ? `
                    <div class="message">
                      ${escapeHtml(donation.message)}
                    </div>
                  `
                  : ""
              }

              <div class="status-donation ${statusClass}">
                Status: ${escapeHtml(statusText)}
              </div>

            </div>

          `;

        }
      ).join("");


  } catch (error) {

    console.error(error);

    showError(
      "Terjadi kesalahan saat memuat dashboard."
    );

  }

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text ?? "";

  return div.innerHTML;

}


/* =========================================
   ERROR
========================================= */

function showError(message) {

  document.getElementById(
    "donationList"
  ).innerHTML =
    `
      <div class="error">
        ${message}
      </div>
    `;

}


/* =========================================
   JALANKAN
========================================= */

loadDashboard();

</script>

</body>
</html>
