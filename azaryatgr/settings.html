<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengaturan Creator - Kyp</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0a0f;
    color: white;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 25px 15px;
}

.back {
    display: inline-block;
    color: white;
    text-decoration: none;
    margin-bottom: 20px;
}

.card {
    background: #15131b;
    border: 1px solid #27232f;
    border-radius: 18px;
    padding: 25px;
}

h1 {
    margin-top: 0;
    font-size: 26px;
}

.subtitle {
    color: #a1a1aa;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 8px;
    color: #d4d4d8;
    font-size: 14px;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #302c38;
    background: #0b0a0f;
    color: white;
    font-size: 15px;
    outline: none;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

input:focus,
textarea:focus {
    border-color: #8b5cf6;
}

.button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: white;
    color: black;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.button:disabled {
    opacity: 0.6;
}

.status {
    margin-top: 15px;
    text-align: center;
    color: #a1a1aa;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

<a href="dashboard.html" class="back">← Kembali</a>

<div class="card">

<h1>Pengaturan Creator</h1>

<p class="subtitle">
Atur informasi yang akan ditampilkan di halaman donasimu.
</p>

<label>Nama Creator</label>
<input
    type="text"
    id="displayName"
    placeholder="Contoh: Azaryatgr"
>

<label>Username</label>
<input
    type="text"
    id="username"
    value="azaryatgr"
    readonly
>

<label>Bio</label>
<textarea
    id="bio"
    placeholder="Ceritakan sedikit tentang dirimu..."
></textarea>

<label>Link Halaman Donasi</label>
<input
    type="text"
    id="donationLink"
    placeholder="https://kyp.co.id/..."
    readonly
>

<button class="button" id="saveButton" onclick="saveProfile()">
    Simpan Pengaturan
</button>

<div class="status" id="status"></div>

</div>
</div>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://qgjcnxremlucixexaryj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MUaoxjo8pjoCS2Jj7BVnAg_EoJXD8XD";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   CREATOR ID
========================= */

let currentUsername = "azaryatgr";
let currentCreatorId = null;


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile() {

    const status =
        document.getElementById("status");

    status.textContent =
        "Memuat data...";

    try {

        const { data, error } =
            await supabaseClient
                .from("profiles")
                .select(
                    "id, username, display_name, bio, donation_link"
                )
                .eq(
                    "username",
                    currentUsername
                )
                .maybeSingle();

        if (error) {

            console.error(error);

            status.textContent =
                "Gagal memuat data.";

            return;
        }

        if (!data) {

            status.textContent =
                "Creator tidak ditemukan.";

            return;
        }

        currentCreatorId =
            data.id;

        currentUsername =
            data.username;

        document.getElementById(
            "displayName"
        ).value =
            data.display_name || "";

        document.getElementById(
            "username"
        ).value =
            data.username || "";

        document.getElementById(
            "bio"
        ).value =
            data.bio || "";

        document.getElementById(
            "donationLink"
        ).value =
            "https://kyp.co.id/" +
            data.username;

        status.textContent = "";

    } catch (error) {

        console.error(error);

        status.textContent =
            "Terjadi kesalahan saat memuat data.";

    }
}



/* =========================
   SAVE PROFILE
========================= */

async function saveProfile() {

    const status =
        document.getElementById("status");

    const saveButton =
        document.getElementById("saveButton");

    const displayNameInput =
    document.getElementById("displayName");

const displayName =
    displayNameInput.value.trim();

    const bio =
        document.getElementById("bio")
        .value
        .trim();

    const donationLink =
        document.getElementById("donationLink")
        .value
        .trim();


    if (!displayName) {

    console.log(
        "DEBUG displayName:",
        displayNameInput.value
    );

    status.textContent =
        "Nama Creator terbaca kosong. Coba reload halaman.";

    return;
    }


    saveButton.disabled = true;

    status.textContent =
        "Menyimpan...";


    try {

        const {
            data,
            error
        } = await supabaseClient

            .from("profiles")

            .update({

                display_name:
                    displayName,

                bio:
                    bio,

                donation_link:
                    donationLink

            })

            .eq(
                "username",
                "azaryatgr"
            )

            .select()
            .single();


        if (error) {

            console.error(
                "UPDATE ERROR:",
                error
            );

            status.textContent =
                "Gagal menyimpan: " +
                error.message;

            return;
        }


        document.getElementById(
            "displayName"
        ).value =
            data.display_name || "";


        document.getElementById(
            "username"
        ).value =
            "azaryatgr";


        document.getElementById(
            "bio"
        ).value =
            data.bio || "";


        document.getElementById(
            "donationLink"
        ).value =
            data.donation_link || "";


        status.textContent =
            "✓ Pengaturan berhasil disimpan!";


    } catch (error) {

        console.error(error);

        status.textContent =
            "Terjadi kesalahan: " +
            error.message;

    } finally {

        saveButton.disabled = false;

    }

}

    
                    

/* =========================
   START
========================= */

loadProfile();

</script>

</body>
</html>
